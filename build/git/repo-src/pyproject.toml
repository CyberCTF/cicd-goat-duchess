[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "duchess"
version = "0.1.0"
description = "Tidy helpers shared across Wonderland services."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Duchess", email = "duchess@wonderland.example" }]

[project.urls]
Homepage = "https://wonderland.example/duchess"

[tool.setuptools.packages.find]
include = ["duchess*"]
