# Serve the bare repository under /srv/git over HTTP, read-only. This is enough for `git clone`
# (the dumb HTTP protocol: static objects and refs, after `git update-server-info`) and so for
# browsing history in the clone. Runs as root in the container; the repo files are world-readable.
user root;
worker_processes 1;
error_log /dev/stderr warn;
pid /run/nginx/nginx.pid;

events { worker_connections 256; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log    /dev/stdout;
    sendfile      on;

    server {
        listen 3000;
        server_name _;
        root /srv/git;
        autoindex off;

        # Static file serving of the bare repo (dumb HTTP). A missing path is a 404.
        location / {
            try_files $uri =404;
        }
    }
}
